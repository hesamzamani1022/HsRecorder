name: Build HsRecorder APK

'on':
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android platforms and build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Extract project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/hsrecorder-source"
          mkdir -p "$dest"
          unzip -q HsRecorder_project.zip -d "$dest"
          project_dir="$(find "$dest" -name settings.gradle | head -n 1)"
          if [ -z "$project_dir" ]; then
            echo "settings.gradle not found" >&2
            exit 1
          fi
          project_dir="$(dirname "$project_dir")"
          echo "sdk.dir=$ANDROID_HOME" > "$project_dir/local.properties"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HsRecorder-APK
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
