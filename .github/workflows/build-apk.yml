name: Build HsRecorder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Locate or extract project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            find "$GITHUB_WORKSPACE" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -print -quit
          }

          SETTINGS="$(find_project)"

          if [ -z "$SETTINGS" ]; then
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" \
              -type f \
              -iname 'HsRecorder_project.zip' \
              -print -quit)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Project files and HsRecorder_project.zip were not found."
              exit 1
            fi

            mkdir -p "$GITHUB_WORKSPACE/extracted-project"
            unzip -q -o "$ZIP_FILE" \
              -d "$GITHUB_WORKSPACE/extracted-project"

            SETTINGS="$(find_project)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::No settings.gradle or settings.gradle.kts found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "Project directory: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          GRADLE_VERSION="8.2"
          WRAPPER_PROPERTIES="$PROJECT_DIR/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER_PROPERTIES" ]; then
            DETECTED_VERSION="$(sed -nE \
              's/.*gradle-([0-9]+(\.[0-9]+)+)-(bin|all)\.zip.*/\1/p' \
              "$WRAPPER_PROPERTIES" | head -n 1)"

            if [ -n "$DETECTED_VERSION" ]; then
              GRADLE_VERSION="$DETECTED_VERSION"
            fi
          fi

          echo "Gradle version: $GRADLE_VERSION"
          echo "gradle-version=$GRADLE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ steps.project.outputs.gradle-version }}

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: gradle --no-daemon assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HsRecorder-debug
          path: |
            ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
